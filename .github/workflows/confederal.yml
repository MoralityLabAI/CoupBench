name: Confederal resilience offline

on:
  pull_request:
    paths:
      - "coupbench/confederal.py"
      - "tests/test_confederal.py"
      - "docs/CONFEDERAL.md"
      - ".github/workflows/confederal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confederal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install package and tests
        run: python -m pip install -e ".[dev]"
      - name: Check confederal regression tests
        run: python -m pytest -q tests/test_confederal.py
      - name: Run model-free paired controls
        run: |
          python -m coupbench.confederal --tier 3 --seeds 40 > /tmp/confederal.json
          python -c 'import json; d=json.load(open("/tmp/confederal.json")); assert d["seeds"] == 40 and len(d["arms"]) == 5; print(json.dumps(d["arms"], sort_keys=True, indent=2))'
