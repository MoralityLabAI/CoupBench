name: Coalition hinge and multi-agent regressions

on:
  pull_request:
    paths:
      - "coupbench/coalition_hinge.py"
      - "coupbench/multi.py"
      - "coupbench/metrics.py"
      - "tests/test_coalition_hinge.py"
      - "tests/test_multi.py"
      - ".github/workflows/coalition-hinge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install package and test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run deterministic regression tests
        run: python -m pytest -q tests/test_coalition_hinge.py tests/test_multi.py
      - name: Run the seeded, model-free paired diagnostic
        run: |
          python -m coupbench.coalition_hinge --tier 3 --seed 0 --seeds 40 --draws 1000 --output out/coalition_hinge_t3.json
          python -c 'import json; r=json.load(open("out/coalition_hinge_t3.json")); assert len(r["per_seed"])==40; print(json.dumps(r["arm_means"], sort_keys=True, indent=2))'
